    <body>
        <div class="btnContainer">
            <button id="ARBtn">Enter AR mode</button>
            <button id="VRBtn">Enter VR mode</button>
        </div>
        <a-scene xr-mode-ui="enabled: true; enterVRButton: #VRBtn; enterARButton: #ARBtn; XRMode: xr;" renderer="antialias: true; colorManagement: true;">
            <a-assets>
                <a-asset-item id="quest-touch-plus-left" src="/assets/quest-touch-plus-left.glb"></a-asset-item>
                <a-asset-item id="quest-touch-plus-right" src="/assets/quest-touch-plus-right.glb"></a-asset-item>
            </a-assets>
            <a-entity id="userHead">
                <a-camera id="camera" position="0 1.78 0" six-dimension-tracker="tag: head"></a-camera>
            </a-entity>
            <a-entity meta-touch-controls="hand: left; model: true;" controller-listener="hand: left;" six-dimension-tracker="tag: left">
                <a-entity gltf-model="#quest-touch-plus-left" scale="1 1 1"></a-entity>
            </a-entity>
            <a-entity meta-touch-controls="hand: right; model: true;" controller-listener="hand: right;" six-dimension-tracker="tag: right">
                <a-entity gltf-model="#quest-touch-plus-right" scale="1 1 1"></a-entity>
            </a-entity>
            <a-entity laser-controls="hand: left" raycaster="lineColor: #ff00a0; lineOpacity: 0.9; showLine: true" id="rayCasterLeft"></a-entity>
            <a-entity laser-controls="hand: right" raycaster="lineColor: #a000ff; lineOpacity: 0.9; showLine: true" id="rayCasterRight"></a-entity>
            <a-box position="1.5 1.78 -1.5" rotation="0 0 0"
                   material="color: #ADFF2F; shader: standard; metalness: 0; roughness: 1; emissive: #ADFF2F; emissiveIntensity: 1" hover-color-change>
                <a-animation attribute="material.emissiveIntensity" from="0.6"
                             to="2" dur="900" direction="alternate"
                             repeat="indefinite"></a-animation>
            </a-box>
            <a-entity
                id="textArea"
                position="0 1.5 -2"
                geometry="primitive: plane;  width: 3; height: auto"
                material="color: #ADFF2F; transparent: true; opacity: 0.80;"
                text="anchor: center; baseline: center; wrapCount: 40;
                        transparent: true; opacity: 0.90; color: #000000;
                        value: 1 \n 2 \n 3 \n 4"
                vr-log>
            </a-entity>

        </a-scene>
        <script src="main.js"></script>
    </body>
